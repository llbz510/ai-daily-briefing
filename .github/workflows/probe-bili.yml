name: Probe Bilibili WARP

# 临时诊断：在 runner 上启用 Cloudflare WARP 换出口 IP，看能否绕过 B 站 412
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install deps
        run: python -m pip install --quiet --disable-pip-version-check yt-dlp requests

      - name: Show original IP
        run: |
          echo "=== 原始出口 IP ==="
          curl -s -m 20 https://ipinfo.io/json || echo "ipinfo failed"

      - name: Set up Cloudflare WARP
        run: |
          set -x
          curl -fsSL https://pkg.cloudflareclient.com/pubkey.gpg \
            | sudo gpg --yes --dearmor --output /usr/share/keyrings/cloudflare-warp-archive-keyring.gpg
          CODENAME=$(lsb_release -cs)
          echo "deb [arch=amd64 signed-by=/usr/share/keyrings/cloudflare-warp-archive-keyring.gpg] https://pkg.cloudflareclient.com/ ${CODENAME} main" \
            | sudo tee /etc/apt/sources.list.d/cloudflare-client.list
          sudo apt-get update -qq || {
            echo "noble 源失败，回退 jammy"
            echo "deb [arch=amd64 signed-by=/usr/share/keyrings/cloudflare-warp-archive-keyring.gpg] https://pkg.cloudflareclient.com/ jammy main" \
              | sudo tee /etc/apt/sources.list.d/cloudflare-client.list
            sudo apt-get update -qq
          }
          sudo apt-get install -y -qq cloudflare-warp
          warp-cli --accept-tos registration new || true
          warp-cli --accept-tos mode proxy
          warp-cli --accept-tos proxy port 40000
          warp-cli --accept-tos connect || true
          sleep 10
          warp-cli --accept-tos status || true

      - name: Verify WARP proxy
        run: |
          echo "=== 经 WARP 的出口 IP ==="
          curl -s -m 25 --socks5-hostname 127.0.0.1:40000 https://ipinfo.io/json || echo "warp 代理不可用"

      - name: Probe Bilibili via WARP
        run: |
          python - <<'PY'
          import subprocess, sys, requests
          UID = "65564239"
          PROXY = "socks5://127.0.0.1:40000"
          UA = ("Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 "
                "(KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36")

          print("=" * 68)
          print("### yt-dlp 经 WARP")
          p = subprocess.run([sys.executable, "-m", "yt_dlp", "--proxy", PROXY,
                              "--playlist-end", "3", "--dump-json", "--skip-download",
                              "--no-warnings", "--socket-timeout", "30",
                              "https://space.bilibili.com/%s/video" % UID],
                             capture_output=True, text=True, encoding="utf-8", timeout=240)
          hits = [l for l in (p.stdout or "").splitlines() if l.strip().startswith("{")]
          print("  拿到 %d 条" % len(hits))
          for l in hits[:3]:
              import json
              d = json.loads(l)
              print("    %s | %s" % (d.get("upload_date"), (d.get("title") or "")[:56]))
          if not hits:
              err = (p.stderr or "").strip().splitlines()
              print("  err:", err[-1][:150] if err else "无输出")

          print()
          print("### 官方 API 经 WARP")
          s = requests.Session()
          s.proxies = {"http": PROXY, "https": PROXY}
          s.headers.update({"User-Agent": UA, "Referer": "https://space.bilibili.com/%s/video" % UID})
          try:
              s.get("https://www.bilibili.com/", timeout=30)
              j = s.get("https://api.bilibili.com/x/space/arc/search",
                        params={"mid": UID, "ps": 5, "pn": 1, "order": "pubdate"}, timeout=30).json()
              print("  space/arc/search code=%s msg=%s" % (j.get("code"), j.get("message")))
          except Exception as e:
              print("  API 失败:", type(e).__name__, str(e)[:90])
          PY

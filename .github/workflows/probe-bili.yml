name: Probe Bilibili WARP API

# 临时诊断：WARP 换 IP 后，测 WBI 签名的官方 API（上一轮因缺 pysocks 未测到）
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install deps
        run: python -m pip install --quiet --disable-pip-version-check "requests[socks]" yt-dlp

      - name: Set up Cloudflare WARP
        run: |
          curl -fsSL https://pkg.cloudflareclient.com/pubkey.gpg \
            | sudo gpg --yes --dearmor --output /usr/share/keyrings/cloudflare-warp-archive-keyring.gpg
          echo "deb [arch=amd64 signed-by=/usr/share/keyrings/cloudflare-warp-archive-keyring.gpg] https://pkg.cloudflareclient.com/ $(lsb_release -cs) main" \
            | sudo tee /etc/apt/sources.list.d/cloudflare-client.list
          sudo apt-get update -qq
          sudo apt-get install -y -qq cloudflare-warp
          warp-cli --accept-tos registration new || true
          warp-cli --accept-tos mode proxy
          warp-cli --accept-tos proxy port 40000
          warp-cli --accept-tos connect || true
          sleep 10
          warp-cli --accept-tos status || true

      - name: Probe
        run: |
          python - <<'PY'
          import hashlib, json, time, urllib.parse, requests, sys
          UID = "65564239"
          UA = ("Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 "
                "(KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36")
          TAB = [46,47,18,2,53,8,23,32,15,50,10,31,58,3,45,35,27,43,5,49,33,9,42,19,
                 29,28,14,39,12,38,41,13,37,48,7,16,24,55,40,61,26,17,0,1,60,51,30,4,
                 22,25,54,21,56,59,6,63,57,62,11,36,20,34,44,52]

          def wbi_sign(params, img_key, sub_key):
              mk = "".join((img_key + sub_key)[i] for i in TAB)[:32]
              p = dict(params); p["wts"] = round(time.time())
              p = dict(sorted(p.items()))
              p = {k: "".join(c for c in str(v) if c not in "!'()*") for k, v in p.items()}
              q = urllib.parse.urlencode(p)
              p["w_rid"] = hashlib.md5((q + mk).encode()).hexdigest()
              return p

          for label, proxies in [("直连", None), ("经 WARP", {"http": "socks5h://127.0.0.1:40000",
                                                             "https": "socks5h://127.0.0.1:40000"})]:
              print("=" * 66)
              print("### %s" % label)
              s = requests.Session()
              if proxies:
                  s.proxies = proxies
              s.headers.update({"User-Agent": UA, "Referer": "https://space.bilibili.com/%s/video" % UID})
              try:
                  # 0) 出口 IP
                  try:
                      ip = s.get("https://api.ipify.org", timeout=20).text.strip()
                      print("  出口 IP:", ip)
                  except Exception as e:
                      print("  IP 查询失败:", str(e)[:50])
                  # 1) wbi keys
                  nav = s.get("https://api.bilibili.com/x/web-interface/nav", timeout=25).json()
                  wi = (nav.get("data") or {}).get("wbi_img") or {}
                  ik = (wi.get("img_url") or "").rsplit("/", 1)[-1].split(".")[0]
                  sk = (wi.get("sub_url") or "").rsplit("/", 1)[-1].split(".")[0]
                  print("  wbi keys:", bool(ik and sk))
                  # 2) WBI 签名拉投稿
                  prm = wbi_sign({"mid": UID, "ps": 10, "pn": 1, "order": "pubdate",
                                  "platform": "web", "web_location": "1550101"}, ik, sk)
                  j = s.get("https://api.bilibili.com/x/space/wbi/arc/search",
                            params=prm, timeout=30).json()
                  print("  wbi arc/search code=%s msg=%s" % (j.get("code"), j.get("message")))
                  vl = ((j.get("data") or {}).get("list") or {}).get("vlist") or []
                  print("  投稿数:", len(vl))
                  for v in vl[:4]:
                      print("     ", (v.get("title") or "")[:56])
              except Exception as e:
                  print("  失败:", type(e).__name__, str(e)[:110])
          PY

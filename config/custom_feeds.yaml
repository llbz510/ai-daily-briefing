# ===============================================================
# 自定义 RSS 源配置
#   - 由 scripts/custom_feeds/build_feeds.py 读取
#   - 生成 output/custom-feeds/policy.xml 与 market.xml
#   - 再被 config/config.yaml 的 rss.feeds 消费
#
# 【怎么加信源】直接在下面 sources: / quotes: 列表里加一行。
# 【怎么关信源】把该条的 enabled 改成 false。
# ===============================================================

# ------------------------------ 政策 ------------------------------
policy:
  enabled: true
  max_items: 40                 # 最终 RSS 最多保留多少条
  max_age_days: 14              # 只保留最近 N 天的条目（0=不过滤）
  feed:
    title: "政策发布"
    link: "https://www.gov.cn/zhengce/"

  # type 说明:
  #   gov_search = 中国政府网政策文件库官方 JSON 接口（最权威最稳，推荐）
  #   html       = 通用列表页，自动探测列表结构，无需手写选择器
  #                探测不准时可以手填 item_selector，例如 ".infolist li"
  sources:
    # —— 最权威：国务院 + 各部委政策文件（官方接口）——
    - id: gov-zhengce
      name: "国务院·政策文件库"
      type: gov_search
      url: "https://sousuo.www.gov.cn/search-gov/data"
      categories: ["gongwen", "bumenfile"]     # gongwen 国务院公文 / bumenfile 部门文件
      per_page: 20
      enabled: true

    - id: miit-zcwj
      name: "工信部·政务公开"
      url: "https://www.miit.gov.cn/zwgk/index.html"
      base: "https://www.miit.gov.cn"
      enabled: true

    - id: cac-wxfb
      name: "网信办·网信发布"
      url: "https://www.cac.gov.cn/wxzw/wxfb/A093702index_1.htm"
      base: "https://www.cac.gov.cn"
      enabled: true

    - id: csrc-zdgk
      name: "证监会·主动公开目录"
      url: "http://www.csrc.gov.cn/csrc/c100035/zfxxgk_zdgk.shtml"
      base: "http://www.csrc.gov.cn"
      enabled: true

    - id: pbc-fagui
      name: "中国人民银行·法规"
      url: "http://www.pbc.gov.cn/tiaofasi/144941/index.html"
      base: "http://www.pbc.gov.cn"
      enabled: true

    - id: stats-zxfb
      name: "国家统计局·最新发布"
      url: "https://www.stats.gov.cn/sj/zxfb/"
      base: "https://www.stats.gov.cn"
      enabled: true

    # —— 以下站点有反爬，默认关闭；想试就改 enabled: true ——
    - id: nda-zcwj
      name: "国家数据局·政策文件"
      url: "https://www.nda.gov.cn/sjj/zwgk/zcfb/list/index.html"
      base: "https://www.nda.gov.cn"
      enabled: false

    - id: mof-zcfg
      name: "财政部·政策法规"
      url: "https://www.mof.gov.cn/zhengwuxinxi/zhengcefabu/"
      base: "https://www.mof.gov.cn"
      enabled: false

    - id: most-zcwj
      name: "科技部·政策文件"
      url: "https://www.most.gov.cn/xxgk/xinxifenlei/fdzdgknr/fgzc/"
      base: "https://www.most.gov.cn"
      enabled: false

# ------------------------------ 行情 ------------------------------
market:
  enabled: true
  max_items: 40
  feed:
    title: "行情速览"
    link: "https://gu.qq.com/"

  # 数据源：腾讯行情接口 qt.gtimg.cn（免依赖，A股/港股/美股全覆盖）
  # 代码写法：
  #   A股个股   sh600519(贵州茅台)   sz000001(平安银行)
  #   A股指数   sh000001(上证指数)   sz399001(深证成指)  sz399006(创业板指)
  #             sh000688(科创50)     sh000300(沪深300)   sh000016(上证50)  sh000905(中证500)
  #   港股个股   hk00700(腾讯控股)   hk09988(阿里巴巴)
  #   港股指数   hkHSI(恒生指数)     hkHSTECH(恒生科技)
  #   美股个股   usAAPL  usNVDA  usMSFT  usTSLA
  #   美股指数   usINX(标普500)  usIXIC(纳斯达克)  usDJI(道琼斯)
  quotes:
    # —— A股主要指数 ——
    - { code: "sh000001", name: "上证指数" }
    - { code: "sz399001", name: "深证成指" }
    - { code: "sz399006", name: "创业板指" }
    - { code: "sh000688", name: "科创50" }
    - { code: "sh000300", name: "沪深300" }
    - { code: "sh000905", name: "中证500" }
    # —— 港股 / 美股 ——
    - { code: "hkHSI",    name: "恒生指数" }
    - { code: "hkHSTECH", name: "恒生科技指数" }
    - { code: "usINX",    name: "标普500" }
    - { code: "usIXIC",   name: "纳斯达克" }
    # —— 自选标的（改成你关心的就行）——
    - { code: "sh600519", name: "贵州茅台" }
    - { code: "sz000001", name: "平安银行" }
    - { code: "hk00700",  name: "腾讯控股" }
    - { code: "usAAPL",   name: "苹果" }
    - { code: "usNVDA",   name: "英伟达" }
